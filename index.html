<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .game {
            text-align: center;
        }

        h1 {
            color: #42e65a;
            margin-bottom: 10px;
        }

        #score {
            font-size: 20px;
            margin-bottom: 15px;
        }

        canvas {
            background: #1b1b1b;
            border: 3px solid #42e65a;
            border-radius: 15px;
            max-width: 90vw;
            height: auto;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            background: #42e65a;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #2fc744;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🐍 Snake Game</h1>

    <div id="score">
        Score: 0
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <br>

    <button onclick="restartGame()">
        Restart
    </button>

</div>


<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let snake;
let food;

let direction = "right";
let nextDirection = "right";

let score = 0;

let gameRunning = true;


// Snake start
function startGame() {

    snake = [];

    // Snake body
    for (let i = 0; i < 8; i++) {

        snake.push({
            x: 250 - i * 12,
            y: 250
        });

    }

    direction = "right";
    nextDirection = "right";

    score = 0;

    createFood();

    gameRunning = true;

    updateScore();
}


// Create food
function createFood() {

    food = {

        x: Math.random() * 460 + 20,

        y: Math.random() * 460 + 20

    };

}


// Draw snake
function drawSnake() {

    for (let i = snake.length - 1; i >= 0; i--) {

        let part = snake[i];

        ctx.beginPath();

        /*
        Body gradually becomes smaller
        */

        let size = i === 0 ? 22 : 18;

        ctx.arc(
            part.x,
            part.y,
            size / 2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            i === 0 ? "#58e66b" : "#35c957";

        ctx.fill();

    }


    // Snake eyes

    let head = snake[0];

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        head.x + 5,
        head.y - 4,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        head.x + 5,
        head.y + 4,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// Draw food
function drawFood() {

    ctx.beginPath();

    ctx.arc(
        food.x,
        food.y,
        9,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ff3b3b";

    ctx.fill();

}


// Move snake
function moveSnake() {

    direction = nextDirection;

    let head = {

        x: snake[0].x,

        y: snake[0].y

    };


    let speed = 3;


    if (direction === "up") {
        head.y -= speed;
    }

    if (direction === "down") {
        head.y += speed;
    }

    if (direction === "left") {
        head.x -= speed;
    }

    if (direction === "right") {
        head.x += speed;
    }


    snake.unshift(head);


    // Food eaten

    let distance = Math.sqrt(

        Math.pow(head.x - food.x, 2) +

        Math.pow(head.y - food.y, 2)

    );


    if (distance < 18) {

        score++;

        createFood();

        updateScore();

    }

    else {

        snake.pop();

    }


    checkCollision();

}


// Collision
function checkCollision() {

    let head = snake[0];


    // Wall collision

    if (

        head.x < 10 ||

        head.x > canvas.width - 10 ||

        head.y < 10 ||

        head.y > canvas.height - 10

    ) {

        gameOver();

    }


    // Body collision

    for (let i = 10; i < snake.length; i++) {

        let body = snake[i];

        let distance = Math.sqrt(

            Math.pow(head.x - body.x, 2) +

            Math.pow(head.y - body.y, 2)

        );


        if (distance < 12) {

            gameOver();

        }

    }

}


// Game over
function gameOver() {

    gameRunning = false;

    setTimeout(() => {

        alert("Game Over!\nYour Score: " + score);

    }, 100);

}


// Score
function updateScore() {

    document.getElementById("score").innerText =
        "Score: " + score;

}


// Keyboard controls

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp" && direction !== "down") {

        nextDirection = "up";

    }

    if (event.key === "ArrowDown" && direction !== "up") {

        nextDirection = "down";

    }

    if (event.key === "ArrowLeft" && direction !== "right") {

        nextDirection = "left";

    }

    if (event.key === "ArrowRight" && direction !== "left") {

        nextDirection = "right";

    }

});


// Restart

function restartGame() {

    startGame();

}


// Game loop

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (gameRunning) {

        moveSnake();

    }


    drawFood();

    drawSnake();


    requestAnimationFrame(gameLoop);

}


// Start

startGame();

gameLoop();

</script>

</body>
</html>
